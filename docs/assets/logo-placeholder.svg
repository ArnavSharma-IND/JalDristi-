<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Aura Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00b4d8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#03045e" stop-opacity="0" />
    </radialGradient>

    <!-- Droplet Primary Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="30%" stop-color="#00b4d8" />
      <stop offset="70%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <!-- Droplet Inner Glass / Depth Gradient -->
    <linearGradient id="innerDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#90e0ef" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#03045e" stop-opacity="0.6" />
    </linearGradient>

    <!-- Iris / Vision Lens Gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f5d4" />
      <stop offset="65%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#03045e" />
    </radialGradient>

    <!-- Telemetry Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0077b6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Orbiting Telemetry Nodes / Radar Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 14" opacity="0.6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="40 180" opacity="0.4" />

  <!-- Radar Sensor Orbit Points -->
  <circle cx="256" cy="38" r="4.5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="474" cy="256" r="4" fill="#00b4d8" />
  <circle cx="256" cy="474" r="3.5" fill="#0077b6" />
  <circle cx="38" cy="256" r="4" fill="#48cae4" />

  <!-- Main Water Droplet Body with Shadow -->
  <g filter="url(#dropShadow)">
    <path d="M 256,60 
             C 256,60 384,215 384,324 
             A 128,128 0 0,1 128,324 
             C 128,215 256,60 256,60 Z" 
          fill="url(#dropGrad)" />

    <!-- Inner Droplet Glass Lighting / Shading Overlay -->
    <path d="M 256,66 
             C 256,66 376,218 376,324 
             A 120,120 0 0,1 136,324 
             C 136,218 256,66 256,66 Z" 
          fill="url(#innerDrop)" />

    <!-- Droplet Top-Left Specular Highlight -->
    <path d="M 256,92 
             C 246,120 168,236 160,300 
             C 156,260 190,175 256,92 Z" 
          fill="#ffffff" 
          opacity="0.38" />
  </g>

  <!-- Subsurface Aquifer Water Table Waves (Inside Bottom of Droplet) -->
  <g opacity="0.35">
    <path d="M 152,350 Q 200,320 256,350 T 360,350 A 128,128 0 0,1 256,452 A 128,128 0 0,1 152,350 Z" fill="#03045e" />
    <path d="M 168,380 Q 210,360 256,380 T 344,380 A 128,128 0 0,1 256,452 A 128,128 0 0,1 168,380 Z" fill="#0077b6" />
  </g>

  <!-- "Drishti" (Vision / Eye) Center Emblem -->
  <!-- Outer Eye Shape -->
  <g filter="url(#glow)">
    <!-- Eye Contour Upper & Lower Arcs -->
    <path d="M 166,310 Q 256,220 346,310 Q 256,400 166,310 Z" 
          fill="#0a192f" 
          stroke="url(#ringGrad)" 
          stroke-width="4.5" />

    <!-- Iris (Insight Lens) -->
    <circle cx="256" cy="310" r="42" fill="url(#irisGrad)" />

    <!-- Pupil & Depth Sensor Reticle -->
    <circle cx="256" cy="310" r="22" fill="#03045e" />
    <circle cx="256" cy="310" r="10" fill="#00f5d4" />
    <circle cx="256" cy="310" r="4" fill="#ffffff" />

    <!-- Sensor Target Reticle Crosshairs -->
    <line x1="256" y1="260" x2="256" y2="272" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="256" y1="348" x2="256" y2="360" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="206" y1="310" x2="218" y2="310" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />
    <line x1="294" y1="310" x2="306" y2="310" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eye Corner Telemetry Dots -->
    <circle cx="180" cy="310" r="2.5" fill="#00f5d4" />
    <circle cx="332" cy="310" r="2.5" fill="#00f5d4" />
  </g>

  <!-- DWLR Digital Telemetry Signals / Depth Waves Rising to Apex -->
  <path d="M 218,205 Q 256,180 294,205" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 230,165 Q 256,145 282,165" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 242,125 Q 256,110 270,125" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Telemetry Digital Pulse Sparks -->
  <circle cx="256" cy="118" r="2.5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="256" cy="155" r="2.5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="256" cy="192" r="2.5" fill="#00f5d4" filter="url(#glow)" />
</svg>
