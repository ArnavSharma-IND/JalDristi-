version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jaldrishti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jaldrishti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaldrishti_pass}
      POSTGRES_DB: ${POSTGRES_DB:-jaldrishti_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jaldrishti_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: jaldrishti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-jaldrishti_user}:${POSTGRES_PASSWORD:-jaldrishti_pass}@db:5432/${POSTGRES_DB:-jaldrishti_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jaldrishti-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
